services:
  engine:
    build:
      context: .
      dockerfile: src/FlipZA.Engine/Dockerfile
    image: flipza-engine
    restart: unless-stopped
    environment:
      TZ: Africa/Johannesburg
    volumes:
      # Host folder must be writable by the container's "app" user (uid 1654):
      #   mkdir -p data && sudo chown 1654:1654 data
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
